blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@kikiutils/eslint-config' # TODO: remove it
  - '@kikiutils/stylelint-config' # TODO: remove it
  - '@kikiutils/nuxt' # TODO: remove it
  - '@kikiutils/shared' # TODO: remove it

resolutionMode: highest
trustLockfile: false
# eslint-disable-next-line pnpm/yaml-enforce-settings
trustPolicy: off
strictSsl: true
strictStorePkgContentCheck: true
verifyStoreIntegrity: true
preferFrozenLockfile: true
shellEmulator: true
sideEffectsCache: true
strictDepBuilds: true
updateNotifier: false

overrides:
  stylelint: ^17.16.0
  typescript: ^6.0.3

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  msgpackr-extract: true
