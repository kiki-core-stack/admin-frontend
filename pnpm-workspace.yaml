minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@kikiutils/mongoose' # TODO: remove it
  - '@kikiutils/shared' # TODO: remove it

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  - undici-types@6.21.0

shamefullyHoist: true
shellEmulator: true

overrides:
  '@typescript-eslint/eslint-plugin': 3.3.11
  '@vue/language-core': 3.3.11
  typescript: ^6.0.3
  vue-tsc: 3.3.11

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
